<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- RYSUNEK NA 32 px (i na 16@2x). To NIE jest rysunek pelny przeskalowany.

       Co sie zmienia i dlaczego:
         * KRAWEDZIE GRUBSZE: 71 zamiast 44. Przy 32 px krawedz 44 mierzy 1,4 piksela i cztery
           takie zlewaja sie w plame.
         * WEZLY JEDNA BARWA (#dfdcff), bez gradientu. Gradient na wezle o 2,8 piksela to jeden
           piksel szarosci, ktory tylko zamula ksztalt.
         * BEZ SHEENU I BEZ KRAWEDZI WEWNETRZNEJ: obie operuja na 0,1 piksela.
         * TEMAT WIEKSZY: 79% szerokosci plotna przy 10% marginesu, bo im mniejsza ikona, tym
           mniej wolno jej marnowac na puste pole.

       TLO JEST DOKLADNIE TO SAMO, co w rysunku pelnym - te same trzy przystanki. Ikona, ktora
       zmienia barwe razem z rozmiarem, jest w Docku i na pasku menu dwiema roznymi ikonami. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#4a44c8"/>
      <stop offset="55%" stop-color="#2a2486"/>
      <stop offset="100%" stop-color="#171240"/>
    </radialGradient>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g fill="none" stroke="#bdb6ff" stroke-width="71" stroke-linecap="round">
      <path d="M204 512 L512 351"/>
      <path d="M204 512 L512 673"/>
      <path d="M512 351 L820 512"/>
      <path d="M512 673 L820 512"/>
    </g>
    <circle cx="204" cy="512" r="90" fill="#dfdcff"/>
    <circle cx="512" cy="351" r="90" fill="#dfdcff"/>
    <circle cx="512" cy="673" r="90" fill="#dfdcff"/>
    <circle cx="820" cy="512" r="99" fill="#dfdcff"/>
  </g>
</svg>
