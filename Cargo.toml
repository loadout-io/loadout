[workspace]
resolver = "3"
members = ["src-tauri"]
# Dodatkowe biny (probe CLI, bench) dołożymy jako osobnych członków.
# default-members pilnuje, żeby wewnętrzna pętla ich nie kompilowała.
default-members = ["src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# Polityka lintów mieszka TUTAJ, nie w stringu w skrypcie CI.
# Powód: IDE czyta workspace.lints, nie czyta scripts/ci.sh.
# meetnotes ma politykę tylko w CI i to jest tam nazwane błędem (raport 04, §11-Don't).
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Kategorie
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Rzeczy, które naprawdę psują agentowy runtime
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
# Blokada w kodzie asynchronicznym to zawieszona aplikacja, nie wolniejsza.
await_holding_lock = "deny"

# Świadome wyłączenia: pedantic wymusza je w kodzie, który jest czytelniejszy bez nich.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Skopiowane z meetnotes wraz z incydentem, który za tym stoi:
# bez tego link inkrementalny zżerał 15-20 GB RAM i zamrażał maszynę.
# Cięcie: ~30-40% czasu inkrementalnego. (raport 04, §1.1)
# Dotyczy WYŁĄCZNIE zależności — nasz kod zachowuje symbole debugowe.
# ── CZAS KOMPILACJI, ZMIERZONY 2026-08-18 ───────────────────────────────────────────────────
#
# `debug = 2` (domyslne dla `dev`) generuje pelne debuginfo dla NASZEJ skrzyni i kaze linkerowi
# je scalac przy kazdym z celow testowych. Nikt w tym repo nie uzywa debuggera — uzywamy
# `RUST_BACKTRACE=1` (`.claude/settings.json`), a do niego wystarczaja tablice linii: backtrace
# dalej pokazuje `plik:linia`. Zmierzone na tym drzewie: `target` waz 70 GB przy 936 071 plikach
# w `target/debug/deps`, a cargo skanuje odciski po tym katalogu przy KAZDYM wywolaniu.
# Dla skali: `../meetnotes` ma 950 skrzyn (prawie dwa razy wiecej niz nasze 527) i 19 835 plikow.
#
# `split-debuginfo = "unpacked"` jest tu jawnie, a nie z domyslnych: na macOS to ono decyduje,
# czy po kazdym linkowaniu biegnie `dsymutil`. Domyslna wartosc zmieniala sie miedzy wydaniami
# cargo, a to jest liczba, ktorej nie chcemy zgadywac.
#
# I REGULA, KTORA WYNIKA Z TEGO POMIARU, bo sama zmiana profilu jej nie zapewnia: **kiedy
# `ls target/debug/deps | wc -l` przekracza kilkadziesiat tysiecy, zawolaj `cargo clean`.**
# Cargo nie sprzata starych artefaktow, a odciski sprawdza po CALYM katalogu — wiec koszt kazdego
# wywolania rosnie z liczba plikow, ktorych juz nikt nie uzywa. Zmierzone 2026-08-18, przed i po:
#
#   `cargo clean`                   usunelo 962 738 plikow / 118,7 GiB
#   pelny build (lib + testy)       ~7-8 min  ->  36 s
#   cargo clippy --all-targets      263-533 s ->  8 s
#   ./verify.sh quick               534-684 s ->  3,6 s   (sufit 709 -> 45 s)
#   cargo test --tests (calosc)     minuty    ->  7 s
#
# Nie bylo to nigdy wina kompilatora ani `full-test.sh`. `docs/STATUS.md` szukal przyczyny
# w liczbie CELOW testowych (122 -> 1, i to bylo sluszne), ale zostala druga: liczba PLIKOW
# po tamtych celach, ktorej nikt nie skasowal.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
